name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Prepare private test runtime
        run: sudo install -d -o "$(id -u)" -g "$(id -g)" -m 0700 /private/tmp/trading-center-review-runtime
      - name: Run tests
        run: python -m unittest discover -s tests -v

  skill-discovery:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify npx skill discovery
        run: npx --yes skills add . --list
